<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Princess Tale</title>
<!-- An installable game (a PWA): its manifest and icons, iOS's own tags; sw.js keeps its files for offline play. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Princess Tale">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preload" as="image" href="splash-avatar.png">
<link rel="preload" as="image" href="loading.jpg">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e8e4f0; font-family: system-ui, sans-serif; overflow: hidden; }
  /* The client's loading screen (its title scene: scripts/web/title_assets.sh's art and logo, LoadPage's
     DownloadBar under them and its line), in a 9:16 screen as the game's. */
  #loading { position: fixed; inset: 0; z-index: 10; background: #000; display: flex; align-items: center; justify-content: center; }
  #screen { position: relative; height: min(100dvh, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; overflow: hidden;
    background: #000 url(loading.jpg) center / cover no-repeat; container-type: size; }
  /* The apps' splash (apk/branding: brand_ios.py's, brand_android.py's): the avatar, then its short video over it,
     filling the screen; it stays until the video ended and the loading screen's art is there, then fades. */
  #splash { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; align-items: center; justify-content: center;
    transition: opacity 0.35s; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash img { width: min(46vw, 26vh); aspect-ratio: 1; }
  #splash video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.15s; }
  #splash video.playing { opacity: 1; }
  #logo { position: absolute; left: 50%; top: 20.5%; width: 61%; transform: translate(-50%, -50%);
    filter: drop-shadow(0 0.6cqh 0.8cqh #0004); }
  #bar { position: absolute; left: 8.6%; width: 82.8%; top: 93.2%; height: max(7px, 1.5cqh); box-sizing: border-box;
    background: #1f1610; border: max(1px, 0.13cqh) solid #a0968c; border-radius: 99px; overflow: hidden; }
  #bar div { height: 100%; width: 0; background: linear-gradient(#ffe066, #f2b705 55%, #c98a00); border-radius: 99px;
    transition: width 0.2s; }
  #step { position: absolute; left: 0; right: 0; top: 95.4%; text-align: center; font: bold max(10px, 1.6cqh) system-ui, sans-serif;
    color: #fff; text-shadow: 0 0 2px #000, 1px 1px 1px #000, -1px -1px 1px #000, 1px -1px 1px #000, -1px 1px 1px #000; }
  #version { position: absolute; right: 1.5%; bottom: 0.4%; font-size: max(9px, 1.3cqh); color: #bbb; text-shadow: 0 0 2px #000; }
  canvas { display: block; margin: 0 auto; }
  #save { position: fixed; top: 8px; right: 8px; z-index: 5; font-size: 13px; }
  #save > button { background: #2a2a3acc; color: #e8e4f0; border: 1px solid #4a4a5a; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  #menu { display: none; position: absolute; right: 0; top: 30px; background: #1c1c28; border: 1px solid #4a4a5a; border-radius: 6px; padding: 6px; width: 240px; }
  #menu.open { display: block; }
  #menu button, #menu label { display: block; width: 100%; box-sizing: border-box; text-align: left; background: none; color: inherit; border: 0; padding: 7px 8px; font: inherit; cursor: pointer; border-radius: 4px; }
  #menu button:hover, #menu label:hover { background: #2a2a3a; }
  #menu p { margin: 4px 8px 6px; font-size: 12px; opacity: 0.7; line-height: 1.35; }
  #menu input { display: none; }
</style>
</head>
<body>
<!-- The screen's safe area (under an iPhone's notch, above its home indicator), read by the game (main_js.go's screenSize). -->
<div id="safe" style="position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>
<div id="splash">
  <img src="splash-avatar.png" alt="">
  <video muted playsinline></video>
</div>
<div id="loading">
  <div id="screen">
    <img id="logo" src="logo.png" alt="Princess Tale">
    <div id="bar"><div></div></div>
    <div id="step">Loading Resource..</div>
    <div id="version">WEB 2.5.3</div>
  </div>
</div>
<div id="save">
  <button id="open">Sauvegarde</button>
  <div id="menu">
    <p>Gardée dans ce navigateur, à chaque changement. Le fichier .ptsave est celui des apps (Exporter / Importer dans leurs réglages).</p>
    <button id="export">Exporter la sauvegarde (.ptsave)</button>
    <label>Importer une sauvegarde…<input id="file" type="file"></label>
    <button id="download">Télécharger la base (.db)</button>
    <button id="reset">Recommencer une partie</button>
    <p id="memory"></p>
  </div>
</div>
<script src="wasm_exec.js"></script>
<script src="sql-wasm.js"></script>
<script src="save.js"></script>
<script>
  // The splash goes once its video ended (or could not play: 2.5 s at most) and the loading screen's art came.
  (() => {
    const splash = document.getElementById("splash"), video = splash.querySelector("video");
    let played = false, art = false;
    const done = () => {
      if (!played || !art) return;
      splash.classList.add("gone");
      setTimeout(() => splash.remove(), 400);
    };
    const end = () => { played = true; done(); };
    video.addEventListener("playing", () => video.classList.add("playing"));
    video.addEventListener("ended", end);
    video.addEventListener("error", end);
    setTimeout(end, 2500);
    // Its bytes whole (from the worker's cache), played from a blob: Safari asks a worker for parts of a video,
    // which a cache's whole answer does not give.
    fetch("splash.mp4").then(r => r.ok ? r.blob() : Promise.reject()).then(b => {
      video.src = URL.createObjectURL(b);
      return video.play();
    }).catch(end);
    const img = new Image();
    img.onload = img.onerror = () => { art = true; done(); };
    img.src = "loading.jpg";
  })();
  const step = document.getElementById("step"), fill = document.querySelector("#bar div");
  const say = (e) => { if (step) step.textContent = "Error: " + e; else alert(e); };
  // The bar: the save and sql.js (5%), battle.wasm (35%, by its bytes), the files the game starts with (55%: main_js.go's
  // ptProgress), then the game setting itself up ("Login..", as the client's LoadPage) until demoReady.
  const show = (at, text) => { fill.style.width = (100 * Math.min(1, at)).toFixed(1) + "%"; if (text) step.textContent = text; };
  window.ptProgress = (done, total) => show(0.4 + 0.55 * done / total, done < total ? "Loading Game Resource.." : "Login..");
  // main_js.go: ptGame shows the local game's main screen; demoReady comes once it is set up.
  window.ptGame = true;
  window.demoReady = () => document.getElementById("loading").remove();
  // internal/imgdec: the game's pictures decoded by the browser in a worker (decode.js), off the game's frames and
  // several times faster than Go's decoder in WebAssembly; without OffscreenCanvas in workers, Go decodes them.
  // Its worker is made anew once it decoded 128 MB of pixels and has nothing left to do: an iPhone's worker kept its
  // bitmaps' and canvases' memory (the page was stopped past 2 GB, the game's own 300), a worker's end gives it all back.
  if (typeof OffscreenCanvas !== "undefined" && "createImageBitmap" in self) {
    const waiting = new Map();
    let next = 0, decoder = null, decoded = 0;
    const spawn = () => {
      decoder = new Worker("decode.js");
      decoded = 0;
      decoder.onmessage = (e) => {
        const done = waiting.get(e.data.id);
        waiting.delete(e.data.id);
        if (e.data.pixels) decoded += e.data.pixels.length;
        if (done) done(e.data);
        if (decoded > 128 << 20 && waiting.size === 0) {
          decoder.terminate();
          spawn();
        }
      };
    };
    spawn();
    window.ptDecodeImage = (bytes, done, max) => {
      const id = next++;
      waiting.set(id, done);
      decoder.postMessage({ id, bytes, max: max || 0 }, [bytes.buffer]);
    };
  }
  // The game's sounds, played by the page (sound.go's webAudio, main_js.go): Web Audio decodes them (cmd/webaudio's
  // AAC, the voices' samples the game decoded) off the game's frames. Its context starts at the first touch.
  window.ptAudio = (() => {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return undefined;
    // As the apps (Unity's muteOtherAudioSources off: the ambient category): the phone's silent switch mutes the
    // game, and the game leaves the music or podcast playing alone (Safari's Audio Session API, where it is).
    try { if (navigator.audioSession) navigator.audioSession.type = "ambient"; } catch (e) {}
    let ctx = null;
    const context = () => ctx || (ctx = new AC());
    for (const t of ["pointerdown", "touchend", "keydown"]) {
      addEventListener(t, () => { if (context().state !== "running") ctx.resume(); }, true);
    }
    const decode = (url) => fetch(url).then(r => { if (!r.ok) throw new Error(url + ": " + r.status); return r.arrayBuffer(); })
      .then(b => new Promise((ok, ko) => context().decodeAudioData(b, ok, ko)));
    const clips = new Map(); // a clip's decoded samples, kept (the music's are not: a minute of it is 20 MB)
    // The options' volumes (sound.go's volMusic, volEffects, volVoice): a gain each, between the sounds and the speakers.
    const volumes = [1, 1, 1], gains = [];
    const gain = (kind) => {
      if (!gains[kind]) {
        gains[kind] = context().createGain();
        gains[kind].gain.value = volumes[kind];
        gains[kind].connect(ctx.destination);
      }
      return gains[kind];
    };
    const play = (buf, loop, kind) => {
      const src = context().createBufferSource();
      src.buffer = buf;
      src.loop = loop;
      src.connect(gain(kind));
      src.start();
      return src;
    };
    let music = null, musicURL = "";
    let next = null; // a music decoded ahead (preload: a fight's end's), {url, p}
    const clipOf = (url) => {
      let p = clips.get(url);
      if (!p) {
        p = decode(url);
        clips.set(url, p);
        p.catch(() => clips.delete(url));
      }
      return p;
    };
    return {
      clip(url) { clipOf(url).then(b => play(b, false, url.includes("/voice/") ? 2 : 1)).catch(() => {}); },
      volume(kind, v) {
        volumes[kind] = v;
        if (gains[kind]) gains[kind].gain.value = v;
      },
      // preload decodes a clip, or a music (the next one: one kept), before it plays.
      preload(url, isMusic) {
        if (!isMusic) { clipOf(url).catch(() => {}); return; }
        if (!next || next.url !== url) next = { url, p: decode(url) };
        next.p.catch(() => { if (next && next.url === url) next = null; });
      },
      pcm(bytes) { // 16 bits, stereo, 44.1 kHz
        const n = bytes.length >> 2, buf = context().createBuffer(2, n, 44100), v = new DataView(bytes.buffer);
        const l = buf.getChannelData(0), r = buf.getChannelData(1);
        for (let i = 0; i < n; i++) {
          l[i] = v.getInt16(4 * i, true) / 32768;
          r[i] = v.getInt16(4 * i + 2, true) / 32768;
        }
        play(buf, false, 2); // a voice
      },
      music(url, loop) {
        if (music) { try { music.stop(); } catch (e) {} music = null; }
        musicURL = url;
        let p = null;
        if (next && next.url === url) { p = next.p; next = null; }
        if (url) (p || decode(url)).then(b => { if (musicURL === url) music = play(b, loop, 0); }).catch(() => {});
      },
    };
  })();
  // main_js.go: the files the game does not start with, brought into the cache by the worker (sw.js), not kept in
  // the game's memory; without a worker each comes when the game reads it.
  window.ptWarm = (names) => {
    if (!("serviceWorker" in navigator)) return;
    navigator.serviceWorker.ready.then(r => r.active && r.active.postMessage({ warm: names }));
  };
  async function wasm() {
    const r = await fetch("battle.wasm");
    if (!r.ok) throw new Error("battle.wasm: " + r.status);
    const size = +r.headers.get("Content-Length") || 0, reader = r.body.getReader(), parts = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value);
      got += value.length;
      if (size) show(0.05 + 0.35 * Math.min(1, got / size)); // a compressed answer's length is under its bytes
    }
    return new Blob(parts).arrayBuffer();
  }
  const menu = document.getElementById("menu");
  document.getElementById("open").onclick = () => menu.classList.toggle("open");
  const fail = (e) => alert("Erreur : " + (e && e.message ? e.message : e));
  document.getElementById("export").onclick = () => { menu.classList.remove("open"); ptSave.exportFile().catch(fail); };
  document.getElementById("download").onclick = () => { menu.classList.remove("open"); ptSave.download(); };
  // No accept filter: iOS greys out the files whose type it does not know (.ptsave); importFile checks the file.
  document.getElementById("file").onchange = (e) => {
    const f = e.target.files[0];
    e.target.value = "";
    if (f && confirm("Remplacer la sauvegarde de ce navigateur par " + f.name + " ?")) ptSave.importFile(f).catch(fail);
  };
  document.getElementById("reset").onclick = () => {
    if (confirm("Effacer la sauvegarde de ce navigateur et recommencer une partie ?")) ptSave.reset().catch(say);
  };
  // The installed game's worker (sw.js: the files kept for offline play), this build's: one of an older build still
  // in charge would answer from its cache, so the files wait until this one takes over (a few seconds at most).
  const BUILD = "20261102152556"; // build_demo.sh's stamp
  async function worker() {
    if (!("serviceWorker" in navigator)) return;
    const mine = () => (navigator.serviceWorker.controller || {}).scriptURL || "";
    try {
      await navigator.serviceWorker.register("sw.js?v=" + BUILD);
    } catch (e) {
      return;
    }
    if (!mine() || mine().endsWith("v=" + BUILD)) return;
    await new Promise(ok => {
      navigator.serviceWorker.addEventListener("controllerchange", ok);
      setTimeout(ok, 8000);
    });
  }
  // The game's memory (ptMemStats) kept every two seconds: a phone that stops the page shows, once it opens again, what
  // its memory was just before (the menu's last line, the console's ptPrevious).
  const memory = document.getElementById("memory");
  try {
    window.ptPrevious = localStorage.getItem("pt-memory") || "";
    if (ptPrevious) memory.textContent = "Mémoire à la dernière session : " + ptPrevious;
  } catch (e) {}
  setInterval(() => {
    if (typeof ptMemStats !== "function") return;
    const now = new Date().toLocaleTimeString() + " — " + ptMemStats();
    try { localStorage.setItem("pt-memory", now); } catch (e) {}
  }, 2000);
  const go = new Go();
  show(0.01, "Loading Resource..");
  worker()
    .then(openSave)
    .then(() => { show(0.05); return wasm(); })
    .then(b => WebAssembly.instantiate(b, go.importObject))
    .then(r => { show(0.4, "Loading Game Resource.."); go.run(r.instance); })
    .catch(say);
</script>
</body>
</html>
