.banner-text { padding: 28px 24px; max-width: 58%; min-width: 0; }
.eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin: 0 0 14px; }
h1 { font: 400 clamp(40px, 9vw, 64px)/1 var(--font-display); margin: 0 0 12px; text-wrap: balance; }
.sub { margin: 0 0 18px; color: var(--mute); text-wrap: pretty; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 12px/1 var(--font-mono); padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgba(20,17,31,.6); }
.feature { display: grid; grid-template-columns: 36px 1fr; gap: 14px; align-items: start; padding: 16px; margin-top: 20px; border: 1px solid #6a5628; border-radius: 14px; background: linear-gradient(135deg, var(--gold-soft), var(--night-2)); }
.big { margin: 0 0 4px; font: 400 22px/1.25 var(--font-display); text-wrap: balance; }
.why { margin: 0; color: var(--mute); text-wrap: pretty; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 32px 0 4px; padding-bottom: 12px; border-bottom: 1px solid var(--line); font: 500 12px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.key { display: inline-flex; align-items: center; gap: 8px; }
.key .ico { width: 22px; height: 22px; border-radius: 6px; }
.key .ico svg { width: 13px; height: 13px; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
li:last-child { border-bottom: 0; }
li p { margin: 0; min-width: 0; text-wrap: pretty; }
.ico { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 14%, var(--night)); }
.ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.hood { --c: var(--t-hood); } .ico.new { --c: var(--t-new); } .ico.better { --c: var(--t-better); } .ico.fix { --c: var(--t-fix); }
.links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.links a { font: 500 13px/1 var(--font-mono); padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); text-decoration: none; background: var(--night-2); }
.links a:hover { border-color: var(--gold); }
.vnav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; font: 500 12px/1 var(--font-mono); }
.vnav a, .vnav span { padding: 9px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); text-decoration: none; background: var(--night-2); }
.vnav a:hover { border-color: var(--gold); }
.vnav span { color: var(--mute); opacity: .55; }
.vnav .gap { flex: 1; border: 0; background: none; padding: 0; }
.versions { display: grid; gap: 12px; margin-top: 24px; }
.versions a { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--night-2); color: var(--ink); text-decoration: none; }
.versions a:hover { border-color: var(--gold); }
.versions .thumb { width: 96px; height: 72px; border-radius: 10px; background: var(--night) center / cover; }
.versions b { display: block; font: 400 22px/1.2 var(--font-display); }
.versions small { color: var(--mute); }
